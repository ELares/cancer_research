[pytest]
# `slow` marks tests that are correct but too costly to run every time --
# currently the full manifest hash pass, which rehashes the tracked tree. They
# run under `pytest -m slow`; the default run uses a cheaper check of the same
# property. Registered here so an unknown-mark warning cannot hide a typo'd
# marker, which would silently make a test unselectable rather than skipped.
markers =
    slow: costly checks, opt in with -m slow
