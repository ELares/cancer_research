corpus:
  description: >
    4,830 full-text cancer research articles stored as processed
    markdown files (YAML frontmatter + extracted text) in corpus/by-pmid/.
    Sourced from PubMed via scripts/fetch_articles.py.
  total_articles: 4830
  open_access:
    count: 4769
    fraction: 0.987
    note: >
      98.7% of articles are classified as Open Access per OpenAlex
      metadata. OA articles are typically CC BY, CC BY-NC, or equivalent
      licenses that permit redistribution with attribution.
  non_open_access:
    count: 61
    note: >
      61 articles are flagged is_oa=false by OpenAlex but had full text stored.
      The pending follow-up is now DONE (#526): each PMCID was checked against the
      authoritative NCBI PMC Open Access subset service (oa.fcgi), since a PMCID
      alone does not imply redistribution rights. Result: 27 are in the OA subset
      (genuinely redistributable; OpenAlex's is_oa=false was wrong — its ~5% error
      rate) and were KEPT with full text; 34 are NOT in the OA subset (publisher
      copyright) and had their `## Full Text` STRIPPED IN PLACE (abstract + metadata
      retained, a removal notice added) by scripts/strip_non_oa_fulltext.py. The
      records stay in corpus/by-pmid/ so the frozen full-text count (4,830) is
      unchanged, but no copyrighted body is redistributed. See
      analysis/non-oa-fulltext-audit.{md,csv}. Re-run: `--audit` (network) then
      `--apply` (offline). Caveat: those 34 are now abstract-only in place, so a
      future re-run of any body-reading analysis would see slightly less text for
      them (the diagnostic-therapy chain recompute is unaffected — verified, no
      stripped record was a chain member).
    audited_2026_06_26:
      checked: 61
      in_oa_subset_kept: 27
      not_in_subset_stripped: 34
  abstract_archive:
    count: 5586
    note: >
      Abstract-only records in corpus/abstracts/by-pmid/. Bibliographic
      metadata and abstracts are generally not copyrightable under US law
      (Feist Publications v. Rural Telephone Service).

  clinical_trials:
    description: >
      Cancer clinical trial registrations from ClinicalTrials.gov, fetched by
      scripts/trials_fetch.py through the v2 API (123,069 studies match the
      cancer condition). Stored OUTSIDE this repository on external storage.
    source: "ClinicalTrials.gov (U.S. National Library of Medicine)"
    url: "https://clinicaltrials.gov/"
    license: "Public domain (U.S. Government work)"
    redistributable: true
    note: >
      THE ONE SOURCE IN THIS PROJECT WITH NO REDISTRIBUTION QUESTION. A work of
      the United States government is not subject to domestic copyright, and
      ClinicalTrials.gov's terms explicitly permit reuse. Everywhere else this
      project has to keep "readable" and "republishable" apart; here they are
      the same set, so the licence column that governs the article corpus does
      not apply.
    why_this_source: >
      A registry entry is the study AS REGISTERED -- planned arms, endpoints
      and status -- which exists whether or not anyone published the result.
      Publication bias is precisely the gap a literature census cannot see
      from the literature.
    limits: >
      A registration is a statement of intent, not evidence: many trials never
      report, some report elsewhere, and a status field is not an outcome. The
      corpus stores what the registry says and nothing more. Linked PMIDs are
      kept because they are the join to the article corpus.

  expanded_corpus:
    description: >
      A breadth crawl of Europe PMC run by scripts/corpus_expand_fetch.py,
      covering the nine sources listed in that script's SOURCES constant:
      MEDLINE/PubMed (MED), PubMed Central (PMC), preprint servers (PPR),
      patents (PAT), theses via EThOS (ETH), Agricola (AGR), Chinese
      Biological Abstracts (CBA), NHS Evidence (HIR) and CiteXplore (CTX).

      NOT "every source Europe PMC indexes": NCBI Bookshelf (NBK) is indexed
      there and is not crawled here, and the earlier wording claimed
      completeness this crawl does not have. CTX is CiteXplore, a
      bibliographic source -- an earlier version of this entry called it
      "clinical trial texts", which it is not -- and HIR was missing from the
      prose entirely.

      Stored OUTSIDE this repository on external storage; nothing from this
      crawl is committed or redistributed here. Counts are measured, not
      asserted: regenerate them with `python3 scripts/corpus_expand_report.py`,
      which reads the stored shards. That report is deliberately NOT committed
      (it is gitignored) because it is a running total that changes on every
      refresh, so this entry points at the command rather than at a file no
      clone contains.
    location: "external storage (not in git); see scripts/corpus_expand_fetch.py --help"
    rights_model: >
      Two questions are asked separately, because conflating them is how a
      project ends up redistributing something it merely had access to:

        AVAILABILITY -- does Europe PMC hold the text at all? (inEPMC=Y or
        isOpenAccess=Y). Asking for text it does not hold wastes a request per
        record and returns 404.

        PERMISSION -- are we allowed to take it? (isOpenAccess=Y, or an
        explicitly open licence). Europe PMC's isOpenAccess flag means "in the
        OA subset", NOT "openly licensed": roughly 118,000 cancer records carry
        a CC BY licence while flagged OPEN_ACCESS:N, and are legitimately
        collectable despite the flag.

      Full text is requested ONLY through Europe PMC's fullTextXML endpoint,
      which refuses anything it may not serve. No publisher page is ever
      scraped, and no paywall is circumvented -- a 404 is accepted as the
      answer. Metadata and abstracts are collected for all sources including
      the zero-open-access ones, on the Feist reasoning above.
    redistributable: false
    note: >
      "Readable" and "redistributable" are not the same set and are reported
      separately. Bronze open access -- free to read on a publisher's site with
      no licence attached -- is readable but confers no redistribution right,
      and is the larger share of what is freely readable outside PMC.
    deduplication: >
      Every candidate is checked against corpus/atlas/identity.sqlite before it
      is fetched, on three normalised keys (PMID, PMC id, DOI), because the same
      article arrives under different identifiers from different sources and
      indexing only one lets it back in through another door. Audited after the
      fact by scripts/corpus_expand_verify.py, which excludes the crawl's own
      index rows -- an audit that counts them re-discovers its own writes and
      reports every record as a duplicate.

news:
  description: >
    51 news articles fetched by scripts/fetch_news.py from public
    RSS feeds and web pages. Stored as extracted text with metadata
    in news/by-source/.
  sources:
    - "who.int (Tier 1 — institutional)"
    - "sciencedaily.com (Tier 2 — science journalism)"
    - "cancer.org (Tier 3 — advocacy/research)"
  note: >
    News content is stored for research and commentary purposes.
    Individual article redistribution rights depend on each source's
    terms of use. ScienceDaily content summarizes published research
    and is typically available for non-commercial educational use.

calibration_data:
  description: >
    Public datasets used to calibrate / validate the ferroptosis-core simulation
    suite (#330 kill switch, #333 spheroid structure, #334 tumor-PK). Fetched by
    scripts/fetch_calibration_data.py and scripts/validate_spheroid_structure.py;
    the #334 PK targets are transcribed published table values (no raw download).
    Only small DERIVATIVES (dose-response fits; size-binned structure summary; PK
    summary metrics) are committed; the full raw downloads are NOT redistributed.
  assets:
    - name: "Browning 2021 spheroid confocal structure (derived summary)"
      file: "analysis/calibration/spheroid-structure-validation.json"
      source: "Browning et al. 2021 eLife, Data/AllConfocalData.csv"
      url: "https://github.com/ap-browning/Spheroids (raw master/Data/AllConfocalData.csv); Zenodo 10.5281/zenodo.5121093"
      primary_refs:
        - "Browning et al. 2021 eLife, PMID 34842141, DOI 10.7554/eLife.73020"
      license: "Open (eLife CC BY 4.0 article + public author data repository)"
      redistributable: true
      attribution: "Spheroid confocal structure data, Browning et al. 2021 (ap-browning/Spheroids)"
      note: >
        Committed file is a size-binned summary (phi/eta boundary fractions vs outer
        radius) derived from the 994-spheroid confocal dataset, used to validate the
        spheroid module's fixed zone thresholds (#333). The raw CSV is not committed;
        regenerate with scripts/validate_spheroid_structure.py.
    - name: "CTRPv2 ferroptosis-inducer dose-response (derived)"
      file: "analysis/calibration/ctrpv2_ferroptosis_curves.csv"
      source: "CTRPv2 (Cancer Therapeutics Response Portal v2), via DepMap-redistributed 'Harmonized CTD^2 25Q2'"
      upstream_file: "CTRPResponseCurves.csv (md5 36115a26e2cabab33906793ba04c47f8)"
      url: "https://depmap.org/portal/api/download/files"
      primary_refs:
        - "Seashore-Ludlow et al. 2015 Cancer Discov, PMID 26181016"
        - "Rees et al. 2016 Nat Chem Biol, PMID 26656090"
      license: "CC BY 4.0 (DepMap redistribution); underlying CTRPv2/CTD2 data is publicly released by the Broad Institute"
      redistributable: true
      attribution: "CTRPv2 (Broad Institute CTD^2), redistributed via DepMap"
      note: >
        Committed file is a filtered derivative (5 ferroptosis inducers, 3,021
        per-cell-line logistic fits) of the public CTRPv2 release. The raw 45 MB
        CTRPResponseCurves.csv is not committed; regenerate with
        scripts/fetch_calibration_data.py. Used as the #330 calibration target.
    - name: "Ferroptosis-inducer pharmacokinetics (transcribed summary)"
      file: "analysis/calibration/pk_measured_data.csv"
      source: "Published PK tables: IKE (Zhang 2019, Cell Chem Biol) + sorafenib popPK (Jain 2011, Br J Clin Pharmacol)"
      url: "https://pubmed.ncbi.nlm.nih.gov/30799221/ (IKE, PMC6525071); https://pubmed.ncbi.nlm.nih.gov/21392074/ (sorafenib, PMC3162659)"
      primary_refs:
        - "Zhang et al. 2019 Cell Chem Biol, PMID 30799221, DOI 10.1016/j.chembiol.2019.01.008"
        - "Jain et al. 2011 Br J Clin Pharmacol, PMID 21392074, DOI 10.1111/j.1365-2125.2011.03963.x"
      license: "Published summary parameters (facts/data, not creative expression); cited to source"
      redistributable: true
      attribution: "IKE PK (Zhang et al. 2019); sorafenib popPK (Jain et al. 2011)"
      note: >
        Committed file holds transcribed published summary PK metrics (NCA Tmax/Cmax/
        terminal-t1/2/AUC for IKE plasma+tumor; popPK CL/V/transit/EHC for sorafenib),
        not digitized curves or raw downloads. Used as the #334 tumor-PK anchoring
        target (see calibration-targets-pk.md). The per-timepoint IKE curve lives in
        the cited open-access supplement; only the summary metrics are committed.
    - name: "Drug-penetration measured metrics (transcribed summary)"
      file: "analysis/calibration/penetration_measured_data.csv"
      source: "Published penetration tables: Primeau 2005 + Tannock 2002 (doxorubicin half-distances) + Minchinton & Tannock 2006 review range"
      url: "https://pubmed.ncbi.nlm.nih.gov/16361566/ (Primeau 2005); https://pubmed.ncbi.nlm.nih.gov/11895922/ (Tannock 2002); https://pubmed.ncbi.nlm.nih.gov/16862189/ (Minchinton 2006)"
      primary_refs:
        - "Primeau et al. 2005 Clin Cancer Res, PMID 16361566, DOI 10.1158/1078-0432.CCR-05-1664"
        - "Tannock et al. 2002 Clin Cancer Res, PMID 11895922"
        - "Minchinton & Tannock 2006 Nat Rev Cancer, PMID 16862189, DOI 10.1038/nrc1893"
      license: "Published summary metrics (facts/data, not creative expression); cited to source"
      redistributable: true
      attribution: "Doxorubicin penetration metrics (Primeau 2005; Tannock 2002; Minchinton & Tannock 2006)"
      note: >
        Committed file holds transcribed published penetration summary metrics
        (doxorubicin half-distances / penetration-depth ranges in microns, exponential-
        form flags, plus qualitative slow/surface-limited contrasts for platinum and
        paclitaxel), NOT digitized curve points. Used as the #335 Krogh-penetration
        validation target (see penetration-validation.md). No raw image digitization is
        committed; the validation uses the reported summary half-distances.

test_fixtures:
  description: >
    Small assets authored by this project purely to exercise code paths in the
    test suite. Unlike every other class in this file these have no external
    source: they are generated byte-by-byte by a committed script, which is why
    the licence question that motivates this manifest does not arise for them.
    Registered anyway, because the header above claims to cover all non-code
    assets and a binary sitting outside that claim is exactly the kind of quiet
    exception this file exists to prevent.
  assets:
    - file: "tests/fixtures/extraction-sample.pdf"
      source: "Authored by this project"
      generator: "scripts/make_extraction_fixture.py"
      license: "MIT (same as code — it is generated by code in this repo)"
      redistributable: true
      note: >
        A 3-page PDF written from the Python standard library with no PDF
        library involved, deliberately NOT generated with PyMuPDF so that a
        change affecting both writing and reading could not cancel out and
        hide the drift the fixture exists to catch. Its text is invented
        filler about ferroptosis and is NOT a claim about the literature.
        Regenerate with `python scripts/make_extraction_fixture.py`; its
        SHA-256 is pinned in tests/test_pdf_extraction.py.
