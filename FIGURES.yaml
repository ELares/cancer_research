  - manuscript_figure: null
    filename: fig28_census_capture
    generator:
      script: scripts/generate_census_figures.py
      function: fig28_census_capture
    inputs:
      - analysis/atlas-landscape.json
    type: corpus-derived
    status: supplementary
    note: >
      The census layer's first figure. Panel A plots how much of the full
      cancer census the frozen corpus captures per mechanism, on a log axis
      because a linear one collapses everything under 10% into the axis; the
      spread is 213-fold, which bounds every relative prevalence the manuscript
      computes over the corpus. Panel B shows what that does to the central
      corpus claim: the pharmacological-to-physical ratio is 9.1:1 by the
      manuscript's method and 17.6:1 on the census, because the corpus
      over-samples physical modalities 3.3x, so the claim survives and was
      understated. The pharmacological set is a curated list of drug modalities
      imported from atlas_landscape.PHARMACOLOGICAL, not "everything not
      physical" (which would report 12.5:1 by counting delivery platforms and
      genetic tools). Reads only committed atlas JSON, so it regenerates
      offline in seconds; it is a separate script from generate_figures.py,
      which loads the whole corpus and several gitignored simulation outputs.

  - manuscript_figure: 29
    filename: fig29_rare_event_resolution
    generator:
      script: scripts/rare_event_analysis.py
      function: figure
    inputs:
      - analysis/rare-event-sweep.jsonl
    type: simulation
    status: manuscript
    note: >
      How far down the death-rate tail a given sample size can see. Several
      conditions in Figure 7 report exactly 0% at n = 1,000,000; because
      gen_cell draws each per-cell parameter from an unbounded normal, that 0%
      is an upper bound set by the sample size (~3e-6) rather than a
      measurement, so this sweeps n upward and plots how the bound moves. The
      load-bearing element is the dashed zero-event floor: with zero events
      the exact two-sided 95% Poisson upper limit is -ln(0.025)/n = 3.689/n,
      which falls exactly one decade per decade of n, so a series lying on that
      line is reporting the sample size and not the biology. That is NOT the
      rule of three: 3/n is the familiar one-sided 95% approximation, 23%
      lower, recorded per row as `zero_event_upper_bound_95`. An earlier
      version of this figure drew the line at 3/n while plotting the markers at
      3.689/n, so every zero-event marker sat above its own floor. Zero-event runs are drawn as downward carets at
      their upper bound rather than as points at zero, which has no place on a
      log axis; measured rates carry exact Poisson intervals. Zero-event series
      are identical by construction and are offset horizontally a few percent
      so none is hidden under another. Parameters are Params::default(), the
      in-vivo set with zero calibration targets, so the rates are not
      quantitative predictions -- the figure is about resolution, not about
      biology. Regenerates offline in seconds from the committed sweep JSONL.

  - manuscript_figure: 25
    filename: fig30_modality_landscape
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig30_modality_landscape
    inputs:
      - analysis/modality-coverage.json
    type: conceptual
    status: manuscript
    note: >-
      What the simulation engine can be ASKED, against what the field
      publishes. The one figure that answers the criticism this project's
      README invites: a repository addressed to the whole cancer community
      whose engine expresses one mechanism. Panel (a) puts each of the
      taxonomy's sixteen MeSH-measurable mechanisms against its census volume
      and colours it by what the engine can do with it -- applicable as a
      treatment, present but not applicable alone, or absent entirely. Panel
      (b) collapses that to the number a reader should carry away: the share
      of the field's attention and of its registered trials that the engine
      has no representation for at all. EVERY NUMBER IS READ FROM
      analysis/modality-coverage.json, which is itself generated and guarded,
      because a diagram summarising a measurement is the easiest place for one
      to go stale and a picture is harder to notice it in -- this repository
      has shipped that defect in prose more than once. The figure carries the
      profile's refusal verbatim: volume is NOT comparable across mechanisms,
      descriptor breadth varies, so panel (a) is not a ranking and the ENGINE
      colour is its content. It is deliberately a MOVING figure: as arms land
      the grey shrinks, and the caption's arm list is derived from the same
      JSON so it cannot describe an engine that no longer exists.

  - manuscript_figure: 26
    filename: fig31_modality_panel
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig31_modality_panel
    inputs:
      - analysis/modality-panel.json
    type: simulation
    status: manuscript
    note: >-
      Every applicable treatment arm run against the identical tumour from the
      identical seed by `sim-modality-panel`, so a difference between two rows
      is the arm and nothing else. THE GROUPING IS THE FIGURE: a bar chart of
      kill fractions alone would invite exactly the reading
      `analysis/modality-panel.md` refuses -- a ranking of therapies -- so the
      bars are coloured by WHAT KILLS and panel (b) reports the structural
      claim instead, that most arms no longer route through the ferroptosis
      engine at all. That is the answer to the criticism this campaign began
      from, and it is structural rather than an efficacy claim. The sharpest
      row is the ADC: the same exogenous-ROS constant drives it and SDT
      (`params.sdt_ros`, NOT RSL3's GPX4-inhibition branch, which fires only
      for `Treatment::RSL3`) and it kills a fiftieth as much, because the
      payload arrives on a ~150 kDa antibody whose binding-site barrier holds
      penetration to ~7 um -- the first place in this repository where one
      payload constant runs through two delivery routes and the transport
      factor is the only difference, which prices this model's transport layer
      rather than measuring an antibody in tissue. SDT and PDT
      coincide to the last digit because this panel is DEPTH-FREE and their
      exogenous-ROS parameters are equal by default; the thing that separates
      them is a geometry, not a mechanism, and it lives in
      `analysis/depth-reach-comparison.md`. The kill fractions and the route split are
      read from analysis/modality-panel.json. The subtitle's arm and route
      COUNTS are typed, which this note previously denied; they are pinned by
      tests/test_modality_panel.py rather than derived at draw time.

  - manuscript_figure: 27
    filename: fig32_modality_tme
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig32_modality_tme
    inputs:
      - analysis/modality-tme.json
    type: simulation
    status: manuscript
    note: >-
      The resistance sweep for every arm, on a SIGNED scale and split by cell
      state. Both choices are the figure. The analysis behind it once took the
      absolute value of every change and reported an arm that "loses 121%" --
      impossible, and worse, it hid a real result, because one axis HELPS:
      clonal heterogeneity raises the pharmacologic arm's kill by supplying a
      low-glutathione tail that dies while the average cell resists. A
      magnitude colour map paints that the same shade as a catastrophic loss,
      so the map is diverging and zero is neutral. The split by phenotype is
      there because an earlier sweep ran one cell state and reported two axes
      inert -- correctly for that run, and misleadingly, since what was inert
      was the configuration's ability to see them. Red is a loss and blue a
      gain, which is `RdBu` and not `RdBu_r`: the first draft drew the reverse
      of what its own caption said.

  - manuscript_figure: 28
    filename: fig33_adoptive_barriers
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig33_adoptive_barriers
    inputs:
      - analysis/modality-panel.json
    type: simulation
    status: manuscript
    note: >-
      The same CAR-T construct against a leukaemia and a solid tumour, as a
      waterfall on a log axis. The point is that NO SINGLE STEP looks
      catastrophic: three barriers at plausible values leave six per cent,
      exhaustion removes most of what is left, and the product is the
      difference between a therapy that cures a blood cancer and one that does
      very little in a solid tumour -- which is why the model keeps them
      separate instead of fitting one efficacy scalar. The antigen ceiling is
      drawn even though it does NOTHING here, because it is a CAP rather than
      a coefficient and a figure that omitted the inert step would imply all
      three always act. The generator asserts the drawn factors against the
      binary's own binds flag before drawing, since that decomposition was a
      residual once and could not disagree with itself.

  - manuscript_figure: 30
    filename: fig34_depth_reach
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig34_depth_reach
    inputs:
      - analysis/depth-reach-comparison.json
    type: simulation
    status: manuscript
    note: >-
      The manuscript's tissue-access argument, drawn, because what makes it an
      argument is a SHAPE: three physical modalities whose delivered energy
      falls off at rates two orders of magnitude apart, against a pharmacologic
      arm whose delivery does not fall off at all. PDT goes 92.5% to 0.6% over
      9.4 mm while radiation goes 45.4% to 43.7%. THE CONTROL IS DRAWN RATHER
      THAN DROPPED and it is the reason for the second panel: the untreated arm
      "retains" 400% of its surface kill, which is not robustness but what a
      ratio does when both terms are near zero. A panel plotting retention
      alone would rank an untreated tumour first, so retention and absolute
      kill are shown together and the caption says to read neither alone.

  - manuscript_figure: 31
    filename: fig35_calibration_verdicts
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig35_calibration_verdicts
    inputs:
      - analysis/modality-calibration.json
    type: simulation
    status: manuscript
    note: >-
      Per-arm calibration outcome INCLUDING the arms where fitting failed,
      which is the only reason it is worth a figure. A chart of what is fitted
      would be marketing. The THREE rows that are not green carry the
      content, and an earlier version of this note said two -- omitting the
      widest failure on the page. A thermal-ablation arm is UNCONSTRAINED
      because its target admits almost the whole scanned range; checkpoint
      blockade is INADMISSIBLE because its published response band constrains a
      PRODUCT of antigen presentation and kill rate, neither identifiable from
      it alone; and the ADC bystander effect has NO TARGET because nothing
      comparable is published. ADMISSIBLE means a parameter
      reproduces a band, NOT that an arm is validated -- every arm here still
      feeds no number the manuscript reports.
  - manuscript_figure: 32
    filename: fig36_fractionation
    generator:
      script: scripts/generate_conceptual_diagrams.py
      function: fig36_fractionation
    inputs:
      - analysis/calibration/fractionation-validation.json
    type: simulation
    status: manuscript
    note: >-
      The radiation arm's external check, and the reason it is worth a figure
      is panel (a)'s geometry: EQD2 is a function of the alpha/beta you assume,
      so a trial's two arms trace two curves and the CROSSING is the ratio at
      which they are equivalent. Prostate crosses inside the band the
      radiobiology literature estimates independently; breast crosses at 0.70
      Gy, below any plausible tissue, because its shorter arm delivers less
      total dose and was still not inferior. Drawing the failing leg beside the
      passing one is the whole point -- a calibration figure showing only what
      fits is marketing. Panels (b) and (c) are DIRECTION-only and the caption
      says so: the late-responding alpha/beta is a convention rather than a
      measurement, and the reoxygenation half-life is a free parameter no
      dataset in this repository constrains.
