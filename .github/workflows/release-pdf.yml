name: Build & Release PDF

on:
  push:
    branches: [main]
    paths:
      - 'article/**'
      - 'scripts/generate_latex.py'
      - '.github/workflows/release-pdf.yml'
  # The book is COMPILED on a pull request and RELEASED only from main. The
  # design lives in a .sty that loads a dozen packages, and the only place
  # that combination is real is this runner -- finding out after a merge that
  # a package is missing means main's release build is red, which is the one
  # build nobody watches.
  pull_request:
    paths:
      - 'article/**'
      - 'scripts/generate_latex.py'
      - '.github/workflows/release-pdf.yml'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false  # LFS files (books/) not needed for PDF compilation

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-bibtex-extra \
            biber \
            latexmk

      - name: Generate LaTeX from Markdown
        run: python3 scripts/generate_latex.py

      - name: Compile PDF (pdflatex, 3-pass)
        working-directory: article/drafts
        run: |
          # Start from a clean slate so a pass that aborts WITHOUT rewriting can
          # never leave a stale PDF/log for the verify step to bless. The .ent
          # file is the endnotes scratch pad and is rewritten every pass.
          rm -f v1.pdf v1.log v1.aux v1.toc v1.out v1.ent
          # THREE passes, not two. The book has a table of contents whose page
          # numbers move the pages they are printed on, so the document needs a
          # third pass to converge: at two the released PDF's contents were off
          # by two pages against the body, which nothing detected because the
          # build succeeded. The convergence check below is what actually
          # enforces it -- the pass count is only how it is reached.
          #
          # pdflatex exits NON-ZERO on RECOVERABLE errors (e.g. a missing glyph
          # for an unmapped Unicode char) even when it emits a complete PDF. The
          # early passes are allowed to fail (cross-refs aren't resolved yet);
          # the LAST pass is the gate. We capture its exit code and tolerate a
          # non-zero exit ONLY when the sole issue is the known recoverable
          # Unicode-character class. Any OTHER non-zero exit — a fatal LaTeX
          # error, or an OOM/timeout kill that aborts the pass and would
          # otherwise leave a stale earlier PDF — fails the build loudly rather
          # than releasing a stale/broken artifact.
          pdflatex -interaction=nonstopmode v1.tex || true
          pdflatex -interaction=nonstopmode v1.tex || true
          set +e
          pdflatex -interaction=nonstopmode v1.tex
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            if [ -f v1.log ] && grep -q "Unicode character" v1.log; then
              echo "::warning::pdflatex final pass exited ${RC} but only with recoverable Unicode-character errors (an unmapped glyph in scripts/generate_latex.py); tolerating and continuing to the verify gate."
            else
              echo "ERROR: pdflatex final pass exited ${RC} with no recoverable-Unicode marker — treating as a real failure (fatal error or aborted run)."
              tail -n 40 v1.log 2>/dev/null || true
              exit 1
            fi
          fi
          # CONVERGENCE. LaTeX says so itself, and it is the only thing that
          # can: a document still asking to be re-run has printed at least one
          # page number, cross-reference or contents entry that is wrong.
          if grep -qE "Rerun to get|There were undefined references" v1.log; then
            echo "ERROR: the document had not converged after three passes:"
            grep -nE "Rerun to get|There were undefined references" v1.log | head -10
            echo "Add a pass, or find what is oscillating."
            exit 1
          fi

      - name: Verify PDF was generated
        working-directory: article/drafts
        run: |
          if [ ! -f v1.pdf ]; then
            echo "ERROR: PDF not generated"
            exit 1
          fi
          # A fatal/emergency LaTeX error truncates or omits the PDF — catch it
          # even though we tolerated pdflatex's exit code above.
          if grep -qE "Emergency stop|Fatal error occurred|No pages of output" v1.log; then
            echo "ERROR: pdflatex hit a fatal error:"
            grep -nE "Emergency stop|Fatal error occurred|No pages of output" v1.log || true
            exit 1
          fi
          # Sanity floor: the full manuscript PDF is ~1.7 MB / ~120 pages. A fatal
          # abort yields a far smaller (or absent) file. Gate on size (no extra dep).
          BYTES=$(wc -c < v1.pdf)
          echo "PDF size: $(du -h v1.pdf | cut -f1) (${BYTES} bytes)"
          echo "PDF pages: $(pdfinfo v1.pdf 2>/dev/null | grep Pages || echo 'unknown (pdfinfo unavailable)')"
          if [ "${BYTES}" -lt 500000 ]; then
            echo "ERROR: PDF is only ${BYTES} bytes (< 500 KB) — likely a truncated/failed build"
            exit 1
          fi
          # Surface any recovered Unicode errors so they get fixed even though they
          # no longer block the release (generate_latex.py map_greek should prevent them).
          if grep -q "Unicode character" v1.log; then
            echo "::warning::pdflatex recovered from Unicode-character errors (a glyph is unmapped in scripts/generate_latex.py):"
            grep -n "Unicode character" v1.log | head -20 || true
          fi

      - name: Upload the PDF as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manuscript-pdf
          path: article/drafts/v1.pdf

      - name: Generate release tag
        if: github.event_name == 'push'
        id: tag
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          TAG="v$(date -u +%Y.%m.%d)-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Name the released PDF manuscript.{date}.pdf
        if: github.event_name == 'push'
        run: cp article/drafts/v1.pdf "article/drafts/manuscript.${{ steps.tag.outputs.date }}.pdf"

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Manuscript PDF — ${{ steps.tag.outputs.date }}"
          body: |
            Compiled PDF of *Cancer Therapy Mechanisms and Evidence: A Cross-Literature Synthesis* — an evidence-led consolidation of the cancer-therapy literature (4,830 full-text articles across 19 mechanisms and 22 cancer types) paired with multi-scale simulations that test specific mechanistic claims.

            Released as `manuscript.${{ steps.tag.outputs.date }}.pdf`, built from commit ${{ github.sha }}.

            **Changes in this release:**
            ${{ github.event.head_commit.message }}
          files: article/drafts/manuscript.${{ steps.tag.outputs.date }}.pdf
          draft: false
          prerelease: false
