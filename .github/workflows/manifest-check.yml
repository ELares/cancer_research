name: Manifest Freshness

# Guards MANIFEST.sha256 (the release-integrity / provenance manifest tied to the
# Zenodo DOI) against silent drift, the same way cargo-test.yml guards the
# generated ferroptosis.h header: regenerate in CI and fail if the committed file
# no longer matches the tree. Without this gate the manifest re-rots immediately
# (it had drifted by 277 entries — see #522).
#
# No path filter: the manifest hashes every in-scope tracked file (scripts,
# analysis, article, simulations, tags, corpus/INDEX.jsonl, ...), so a PR that
# changes any of them must regenerate it. To fix a failure:
#   python3 scripts/generate_release_manifest.py && git add MANIFEST.sha256
# The generator is stdlib-only and deterministic, so no dependencies are needed.
#
# KNOWN INTERACTION -- this gate makes every DEPENDABOT PR unmergeable, and it
# is not a bug in either. requirements-lock.txt, requirements.txt,
# simulations/Cargo.lock/toml and the workflow files are all inside the manifest
# scope, so any bump leaves MANIFEST.sha256 stale; dependabot cannot run the
# generator, so the check fails on arrival and nothing it opens can ever go
# green. Nine PRs accumulated over a month before anyone traced the cause to
# here rather than to the bumps.
#
# Do NOT narrow the scope to fix this: lockfiles are part of the provenance
# record the Zenodo DOI points at, and excluding them would defeat the gate for
# the files most likely to change silently. Bumps are instead processed in
# BATCHES -- cherry-pick the open dependabot commits onto one branch, regenerate
# the manifest once, run both suites, and close the originals as superseded.
# One review and one CI cycle instead of N of each.
#
# WHEN A CHERRY-PICK CONFLICTS, DO NOT RESOLVE IT BY EDITING THE VERSION STRING.
# Adjacent bumps in requirements-lock.txt conflict routinely, and substituting
# `pkg==old` -> `pkg==new` by hand changes the version WITHOUT the dependency
# closure. That is not hypothetical: feedparser 6.0.14 replaced its SGML backend
# (`sgmllib3k` -> `feedparser-sgmllib`), and the substitution left the lock
# pinning an orphan while the real backend floated unpinned at install time --
# invisible, because CI installs without --no-deps and dependabot cannot propose
# bumps for a package absent from every manifest. Re-resolve instead, per
# CONTRIBUTING.md, and check the lock resolves to exactly itself:
#   pip install --dry-run --ignore-installed --report r.json -r requirements-lock.txt
# then confirm the resolved set equals the pinned set, in both directions.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Regenerate and verify MANIFEST.sha256 is current
        run: |
          python3 scripts/generate_release_manifest.py
          if ! git diff --exit-code -- MANIFEST.sha256; then
            echo "::error file=MANIFEST.sha256::MANIFEST.sha256 is stale. Run: python3 scripts/generate_release_manifest.py && git add MANIFEST.sha256"
            exit 1
          fi
