# Curated MeSH-descriptor -> mechanism reference map for the non-circular
# mechanism-recall measurement (#412). HANDWRITTEN (separate from the scoring
# code in scripts/mechanism_recall.py, per the repo's generated-vs-handwritten
# split). Each descriptor is a precision-first LEAF: an article carrying it is,
# with high precision, genuinely about that mechanism rather than merely
# co-occurring with it. Counts in the notes are verified against
# corpus/by-pmid/*.md mesh_terms (4830 records, ~80.5% with non-empty MeSH).
#
# How it is used: scripts/mechanism_recall.py classifies each descriptor as
# `independent` or `leaky` at runtime (leaky = the descriptor string contains one
# of the mechanism's own MECHANISM_KEYWORDS, so MeSH would tautologically trigger
# the keyword tagger). The HEADLINE recall is computed from the INDEPENDENT
# descriptors only; leaky descriptors are reported separately as near-tautological.
# This is a controlled-vocabulary CONCORDANCE check (MeSH is an independent,
# expert-assigned label), NOT manual ground truth.

# Measurable mechanisms: each has >= 1 discriminative leaf descriptor with a
# usable corpus pool. `descriptors` are candidate MeSH descriptor strings (exact
# PubMed casing). `note` records provenance / the discriminativeness rationale.
mechanisms:
  immunotherapy:
    descriptors: ["Immune Checkpoint Inhibitors", "B7-H1 Antigen", "CTLA-4 Antigen"]
    note: >
      Checkpoint immunotherapy. Bare "Immunotherapy" (n~1011) is the umbrella term
      and is EXCLUDED as non-discriminative; "Immunotherapy, Adoptive" is routed to
      car-t. Keyed on the checkpoint-inhibitor leaf (n~348).
  car-t:
    descriptors: ["Receptors, Chimeric Antigen", "Immunotherapy, Adoptive"]
    note: >
      "Receptors, Chimeric Antigen" (n~248) is the exact CAR leaf (independent of
      the "chimeric antigen receptor" keyword by word order). "Immunotherapy,
      Adoptive" (n~299) sits on ~87% of CAR-T papers, routed here not to immunotherapy.
  oncolytic-virus:
    descriptors: ["Oncolytic Virotherapy", "Oncolytic Viruses"]
    note: Exact oncolytic-virus leaves (n~242/228). Likely classified leaky (string overlap).
  crispr:
    descriptors: ["CRISPR-Cas Systems", "Gene Editing"]
    note: Exact gene-editing leaves (n~149/108).
  nanoparticle:
    descriptors: ["Nanoparticles", "Nanoparticle Drug Delivery System", "Nanomedicine"]
    note: Nanoparticle/nanomedicine leaves (n~261/58).
  synthetic-lethality:
    descriptors: ["Synthetic Lethal Mutations", "Poly(ADP-ribose) Polymerase Inhibitors"]
    note: PARP-inhibitor + synthetic-lethal leaves.
  antibody-drug-conjugate:
    descriptors: ["Immunoconjugates"]
    note: Single ADC parent leaf (n~197); independent of the "antibody-drug conjugate" keyword.
  bispecific-antibody:
    descriptors: ["Antibodies, Bispecific"]
    note: Exact bispecific leaf (n~209). Scaffold mechanism (not in frozen-19 results).
  electrochemical-therapy:
    descriptors: ["Electroporation", "Electrochemotherapy", "Irreversible Electroporation Therapy"]
    note: Electroporation/electrochemotherapy leaves (Electroporation somewhat broad).
  sonodynamic:
    descriptors: ["Ultrasonic Therapy"]
    note: Shared with general ultrasound therapy; lower discriminativeness.
  hifu:
    descriptors: ["High-Intensity Focused Ultrasound Ablation"]
    note: Exact HIFU leaf (n~60).
  epigenetic:
    descriptors:
      ["Histone Deacetylase Inhibitors", "Azacitidine", "Decitabine", "Vorinostat", "DNA Methylation"]
    note: >
      Therapy leaves only. Broad "Epigenesis, Genetic" is general biology (inflates
      the pool, depresses apparent recall) and is EXCLUDED. The lone INDEPENDENT
      leaf is "DNA Methylation". Recall here started as the LOWEST of the headline
      set (~55%) for two reasons: (a) a real gap in keyword coverage, and (b)
      "DNA Methylation" also tags basic methylation BIOLOGY that is not epigenetic
      THERAPY (reference-scope breadth, not a miss). #418 closed the (a) half by
      adding precision-first keywords ("epigenetic regulation/modification",
      "ezh2 inhibitor", "enhancer of zeste", "dnmt"), lifting recall to ~70%; the
      residual gap is the (b) descriptor-breadth half. Note the frozen INDEX.jsonl
      is intentionally NOT re-tagged, so the live-tagger gain shows in the
      leakage-free column, not the production (frozen-snapshot) column.
  microbiome:
    descriptors: ["Fecal Microbiota Transplantation"]
    note: >
      Clean therapy leaf (n~47). Broad "Microbiota"/"Gastrointestinal Microbiome"
      are population/context descriptors and are EXCLUDED.
  frequency-therapy:
    descriptors: []
    # This mechanism has lived in `mechanisms:` with an EMPTY descriptor list
    # since #MECH-PRECISION, and `census_mechanism_profile.py` /
    # `census_external_check.py` both key on that, so its #952 verdict fields
    # go here rather than duplicating the mechanism into `unmeasurable:` --
    # which `tests/test_mechanism_recall.py::test_map_no_mechanism_listed_twice`
    # correctly refuses. `scripts/descriptor_absence_audit.py` derives its
    # mechanism set from BOTH blocks, so a verdict does not depend on which
    # block a mechanism happens to sit in.
    verdict: absent
    covering: []
    adjacent: ["Electromagnetic Fields", "Magnetic Field Therapy"]
    note: >
      NOT MeSH-measurable as of #MECH-PRECISION. "Radiofrequency Ablation" was the
      reference descriptor, but the mechanism is defined in the manuscript as
      "frequency therapy (including pulsed electromagnetic fields)" -- non-thermal
      field modulation -- while radiofrequency ablation is THERMAL tissue
      destruction, a physically different modality. The keyword list has been
      narrowed accordingly, so the descriptor no longer belongs to this mechanism
      and can no longer serve as its reference label.
      Broad "Electromagnetic Fields"/"Magnetic Field Therapy" remain excluded as
      context descriptors, so this mechanism now has no discriminative leaf and is
      reported NOT-MeSH-measurable rather than as zero recall.
      The thermal-ablation literature this tag used to absorb needs its own
      mechanism; until it exists, that literature is a documented coverage gap.
  metabolic-targeting:
    descriptors: ["Warburg Effect, Oncologic", "Glycolysis"]
    note: Warburg leaf is specific but tiny (n~6); Glycolysis broader. Low-confidence.
  phagocytosis-checkpoint:
    descriptors: ["CD47 Antigen"]
    note: Exact leaf but tiny pool (n~18). Scaffold mechanism.
  mrna-vaccine:
    descriptors: ["mRNA Vaccines"]
    note: >
      PROXY-CONFOUNDED: the "mRNA Vaccines" pool is inflated by COVID-19
      mRNA-vaccine-in-cancer-patient papers that the tagger CORRECTLY rejects
      (match_mrna_vaccine exclusion logic), so the recall number here UNDERSTATES
      the tagger and is reported but flagged not-interpretable-as-tagger-recall.
    proxy_confounded: true

# NOT MeSH-measurable as a RECALL REFERENCE, which is the only thing this map
# decides. Three verdicts, each licensing a DIFFERENT claim, and they must not
# be collapsed into "MeSH has no descriptor" -- which is what four generated
# pages and three manuscript sentences did until #952 measured it:
#
#   absent           no descriptor NAMES the mechanism and none CONTAINS it.
#   over-broad       a descriptor contains the mechanism but means far more, so
#                    a count of it over-counts. NOT absence.
#   name-exact-leaky a descriptor names the mechanism exactly, so a census
#                    VOLUME count is available; it is unusable as a recall
#                    reference only because its own string trips the tagger
#                    (LEAKY), which is near-tautological agreement.
#
# `verdict` is a judgement about MeSH semantics and stays handwritten: whether a
# broad descriptor CONTAINS a mechanism or merely RESEMBLES it is not decidable
# by any rule over descriptor names. The checkable half is checked, by
# `scripts/descriptor_absence_audit.py` against the census's own 28,754-
# descriptor vocabulary -- every name here must exist in it, `absent` is refused
# where a covering descriptor is named or a name-exact one is found, and
# `name-exact-leaky` is refused unless `leaves` lists what the scan finds.
#
#   covering  descriptors that CONTAIN the mechanism (so a count over-counts)
#   adjacent  descriptors that RESEMBLE it but are a different thing
#   leaves    exact-name descriptors (volume-measurable, recall-leaky)
#
# NEVER reported as 0% recall, and never as a zero count.
unmeasurable:
  ttfields:
    verdict: absent
    covering: []
    adjacent: ["Electric Stimulation Therapy"]
    reason: >
      No TTFields-specific MeSH descriptor, and none that contains it: an
      alternating intermediate-frequency field disrupting mitosis is not
      therapeutic electrostimulation, so `Electric Stimulation Therapy` (945
      census records) resembles it rather than covering it, and a count of that
      descriptor would be a count of something else. Confirmed absent under
      both arms of the whole-vocabulary scan. ~38% of its tagger-positives also
      have empty MeSH.
  cold-atmospheric-plasma:
    verdict: over-broad
    covering: ["Plasma Gases"]
    adjacent: []
    reason: >
      'Plasma Gases' (D058626) EXISTS and carries 474 census records with 9
      ferroptosis intersections, so the earlier 'no descriptor (n~2)' note here
      was wrong -- see analysis/atlas-thesis-rank.md. It is still not used for
      recall: D058626 sits under Inorganic Chemicals > Gases as a SUBSTANCE,
      its scope note spans surface modification, decontamination, dentistry and
      argon plasma coagulation, and ~23% of its records are not cold
      atmospheric plasma. Unmeasurable here for BREADTH, which is a different
      reason from absence.
  bioelectric:
    verdict: absent
    covering: []
    adjacent: ["Membrane Potentials", "Ion Channels"]
    reason: >
      Only cell-physiology descriptors, carried by any paper measuring them and
      silent on cancer therapy, so they resemble the mechanism's vocabulary
      without containing the therapeutic claim. Absent under both arms; pool
      thin and confounded.
  cuproptosis:
    verdict: over-broad
    covering: ["Copper"]
    adjacent: []
    reason: >
      No cuproptosis MeSH descriptor exists -- absent under both arms of the
      whole-vocabulary scan -- but 'Copper' (D003300) does and carries 6,526
      census records, which CONTAINS the copper-ionophore literature while
      meaning the element. Over-broad rather than absent, and the earlier note
      quoting 'n~6' was a frozen-corpus figure.
  disulfidptosis:
    verdict: name-exact-leaky
    covering: []
    adjacent: []
    leaves: ["Disulfidptosis"]
    reason: >
      'Disulfidptosis' (D000098560) EXISTS and carries 99 census records (2 in
      2024, 87 in 2025, 10 in 2026), so a census volume count IS available and
      the earlier note's 'n=1' was a 4,830-record FROZEN-CORPUS figure carried
      as a reason a census-scale measurement is impossible -- this project's own
      213-fold non-uniform-capture caveat, unapplied to its own unmeasurability
      verdict. Still unusable as a RECALL reference: the descriptor's own string
      trips the mechanism's keywords, so agreement would be near-tautological.
  electrolysis:
    verdict: name-exact-leaky
    covering: []
    adjacent: ["Electrochemotherapy"]
    leaves: ["Electrolysis"]
    reason: >
      'Electrolysis' (D004572) EXISTS and carries 85 census records, against the
      ~19 the earlier frozen-corpus note measured. Bucket-confounded as a recall
      reference -- most of its frozen-corpus pool also carries
      'Electrochemotherapy', which the tagger buckets as electrochemical-therapy
      (a taxonomy-boundary artifact, not a recall miss) -- and leaky besides,
      since the descriptor name is the keyword.
  radioligand-therapy:
    verdict: over-broad
    covering: ["Radiopharmaceuticals"]
    adjacent: ["Radioimmunotherapy"]
    reason: >
      'Radiopharmaceuticals' (D019275) contains the mechanism and carries 31,784
      census records, so it over-counts by orders of magnitude;
      'Radioimmunotherapy' is antibody-specific and bleeds to immunotherapy/ADC.
      No descriptor names radioligand therapy itself under either arm. Scaffold.
  targeted-protein-degradation:
    verdict: name-exact-leaky
    covering: ["Proteolysis"]
    adjacent: []
    leaves: ["Proteolysis Targeting Chimera"]
    reason: >
      'Proteolysis Targeting Chimera' (D000094243) EXISTS and carries 241 census
      records (2022-2026, 49 as major topic, including one Phase III, one Phase I
      and one randomised trial), so this mechanism's census volume and trial
      share ARE measurable and the earlier note reading 'no PROTAC descriptor;
      tiny pool (n~11)' was false against the census it sits beside -- the same
      defect analysis/atlas-thesis-rank.md recorded for cold atmospheric plasma,
      and not an expiry, since the descriptor has carried census records since
      2022. The broad housekeeping 'Proteolysis' (5,288 records) contains it.
      Still unusable as a RECALL reference: the leaf's own string is the keyword.
